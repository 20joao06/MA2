<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gira a sua conta, altere as suas preferências de recomendação e acompanhe as suas encomendas na JVCustom.">
  <title>JVCustom - Área de Cliente</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Estilos Globais -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Estilos Específicos para Perfil -->
  <style>
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
      margin-top: 40px;
      align-items: start;
    }
    
    .profile-sidebar {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 30px;
      text-align: center;
      box-shadow: var(--card-shadow);
    }
    
    .profile-pic-large {
      width: 120px;
      height: 120px;
      border-radius: var(--radius-full);
      object-fit: cover;
      margin: 0 auto 20px;
      border: 3px solid var(--accent-primary);
      box-shadow: var(--glow-shadow);
      background-color: var(--bg-tertiary);
    }
    
    .profile-name {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    
    .profile-email {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    
    .profile-badges {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 0;
    }
    
    .profile-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-full);
    }
    
    .badge-budget {
      background-color: var(--success-bg);
      color: var(--success);
    }
    
    .badge-pref {
      background-color: var(--warning-bg);
      color: var(--warning);
    }
    
    .avatar-selection-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    
    .avatar-option {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius-full);
      cursor: pointer;
      border: 2px solid transparent;
      transition: var(--transition-fast);
      object-fit: cover;
    }
    
    .avatar-option:hover {
      transform: scale(1.1);
    }
    
    .avatar-option.selected {
      border-color: var(--accent-primary);
      box-shadow: var(--glow-shadow);
    }
    
    /* Histórico de Encomendas */
    .history-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--card-shadow);
      margin-bottom: 30px;
    }
    
    .history-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    
    .order-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .order-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-tertiary);
      overflow: hidden;
    }
    
    .order-header {
      padding: 16px 20px;
      background-color: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
    }
    
    .order-id {
      font-family: monospace;
      font-weight: 700;
      color: var(--accent-primary);
      font-size: 14px;
    }
    
    .order-date {
      color: var(--text-muted);
    }
    
    .order-body {
      padding: 20px;
    }
    
    .order-items-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .order-item-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
    }
    
    .order-item-img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
    }
    
    .order-item-info {
      flex-grow: 1;
    }
    
    .order-item-qty {
      color: var(--text-muted);
      font-size: 13px;
    }
    
    .order-item-price {
      font-weight: 700;
    }
    
    .order-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    
    .order-status {
      font-weight: 700;
      color: var(--success);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .order-status::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background-color: var(--success);
    }
    
    .order-total-price {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
    }
    
    .empty-orders {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }
    
    @media (max-width: 900px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho Global -->
  <header id="global-header"></header>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <div class="container" id="profileViewContainer">
      <!-- Injetado Dinamicamente -->
      <div style="text-align: center; padding: 100px 0;">
        <p style="color: var(--text-secondary)">A carregar perfil de utilizador...</p>
      </div>
    </div>
  </main>

  <!-- Rodapé Global -->
  <footer id="global-footer"></footer>

  <!-- Scripts -->
  <script src="js/db.js"></script>
  <script src="js/main.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
